name: Generate snake animation

on:
  schedule:
    # Once daily at 06:17 UTC; an off-hour minute reduces scheduler congestion.
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/generate_snake.py"

concurrency:
  group: profile-snake
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # actions/checkout is maintained by GitHub. The generator and publisher
      # below are owned by this repository and use no third-party actions.
      - name: Check out this repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Generate light and dark snake animations
        run: python3 scripts/generate_snake.py --username "$GITHUB_REPOSITORY_OWNER"

      - name: Publish animations to the output branch
        shell: bash
        run: |
          set -euo pipefail

          output_worktree="$RUNNER_TEMP/snake-output"
          git fetch origin output
          git worktree add --detach "$output_worktree" origin/output

          cp dist/snake.svg "$output_worktree/snake.svg"
          cp dist/snake-dark.svg "$output_worktree/snake-dark.svg"

          cd "$output_worktree"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg snake-dark.svg

          if git diff --cached --quiet; then
            echo "Contribution animations are already up to date."
            exit 0
          fi

          git commit -m "Update contribution snake"
          git push origin HEAD:output
